services:
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: webgis
      POSTGRES_USER: webgis
      POSTGRES_PASSWORD: webgis_dev_password
    ports:
      - "5432:5432"
    volumes:
      - webgis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webgis -d webgis"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  webgis_postgres_data:
